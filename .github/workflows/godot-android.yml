name: Quirk Visual Android

on:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "parts/**"
      - "data/**"
      - "export_presets.cfg"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "quirk-visual-v1"

jobs:
  android:
    name: Build visual Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. ~/.config/godot/; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Import and validate project
        run: |
          godot --headless --editor --quit --path . --verbose

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --install-android-build-template --export-debug "Android Debug" "build/android/${EXPORT_NAME}-debug.apk"

      - name: Sign debug APK
        run: |
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner sign --ks /root/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android "build/android/${EXPORT_NAME}-debug.apk"
          /usr/lib/android-sdk/build-tools/33.0.2/apksigner verify --verbose "build/android/${EXPORT_NAME}-debug.apk"

      - name: Upload visual APK
        uses: actions/upload-artifact@v4
        with:
          name: quirk-visual-v1-debug
          path: build/android/quirk-visual-v1-debug.apk
          if-no-files-found: error


  runtime:
    name: Runtime smoke test
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - name: Download visual APK
        uses: actions/download-artifact@v4
        with:
          name: quirk-visual-v1-debug
          path: build/android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm4all"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r build/android/quirk-visual-v1-debug.apk
            adb shell pm clear com.ugen.playquirk
            adb shell monkey -p com.ugen.playquirk -c android.intent.category.LAUNCHER 1
            sleep 8
            sleep 2
            adb logcat -d -t 1000 > runtime-logcat.txt
            adb shell dumpsys package com.ugen.playquirk > runtime-package.txt
            adb exec-out screencap -p > runtime-launch.png
            if ! adb shell dumpsys activity activities | grep -q "com.godot.game.GodotApp"; then
              echo "QUIRK Godot activity is not active after launch"
              grep -E "FATAL EXCEPTION|AndroidRuntime|Godot|E/|signal|crash" runtime-logcat.txt | tail -200 || true
              exit 1
            fi
            test -s runtime-launch.png

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quirk-visual-v1-runtime-evidence
          path: |
            runtime-launch.png
            runtime-logcat.txt
            runtime-package.txt
          if-no-files-found: warn

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: quirk-visual-v1-runtime-proof
          path: runtime-launch.png
          if-no-files-found: error
